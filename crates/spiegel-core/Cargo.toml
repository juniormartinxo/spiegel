[package]
name = "spiegel-core"
version = "0.1.0"
description = "Núcleo do Spiegel: adb, protocolo do scrcpy e Sessões, sem depender do Tauri"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Expõe o adb falso (`testing::FakeAdb`) para testes de outros crates.
testing = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
spiegel-core = { path = ".", features = ["testing"] }
tempfile = "3"
